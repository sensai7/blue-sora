<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page_description }}">
  <meta name="generator" content="{{ generator_version }}">
  <title>{{ page_title }} · {{ site_name }}</title>
  <link rel="icon" href="{{ root_prefix }}{{ favicon_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ root_prefix }}{{ css_url }}">
  <script src="{{ root_prefix }}{{ js_url }}" defer></script>
</head>
<body class="{{ body_class }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ root_prefix }}index.html" aria-label="Blue Sora home">
      <span class="wordmark-mark" aria-hidden="true">青</span>
      <span>Blue Sora</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="{{ root_prefix }}index.html#collection">Collection</a>
      <a href="{{ root_prefix }}design-system/index.html">Design</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Use dark theme">◐</button>
    </nav>
  </header>
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Public-domain Japanese literature, prepared for careful reading.</p>
    <p><span lang="ja">青空文庫</span> source text remains credited in every work record.</p>
  </footer>
</body>
</html>
